name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worklog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Work log is up to date
        run: python3 tools/worklog.py build --check
      - name: Tool tests
        run: uv run --only-group dev pytest -q
